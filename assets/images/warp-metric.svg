<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="warpGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- Spacetime Curvature Grid -->
  <g stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5" fill="none">
    <ellipse cx="400" cy="225" rx="320" ry="120"/>
    <ellipse cx="400" cy="225" rx="240" ry="90"/>
    <ellipse cx="400" cy="225" rx="160" ry="60"/>
    <ellipse cx="400" cy="225" rx="80" ry="30"/>
    <line x1="80" y1="225" x2="720" y2="225"/>
    <line x1="400" y1="105" x2="400" y2="345"/>
  </g>

  <!-- Metric Bubble Core -->
  <circle cx="400" cy="225" r="45" fill="none" stroke="url(#warpGlow)" stroke-width="4"/>
  <circle cx="400" cy="225" r="15" fill="#c084fc" opacity="0.8"/>

  <text x="50" y="50" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#c084fc" letter-spacing="2">LENTZ SOLITON // METRIC ENGINEERING</text>
</svg>
