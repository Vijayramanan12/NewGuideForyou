<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="qGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Field Vectors & Orbit Rings -->
  <g stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" fill="none">
    <ellipse cx="400" cy="225" rx="280" ry="80" transform="rotate(-25 400 225)"/>
    <ellipse cx="400" cy="225" rx="280" ry="80" transform="rotate(25 400 225)"/>
    <ellipse cx="400" cy="225" rx="280" ry="80" transform="rotate(90 400 225)"/>
  </g>

  <!-- Core Singularity -->
  <circle cx="400" cy="225" r="50" fill="url(#qGlow)" opacity="0.3"/>
  <circle cx="400" cy="225" r="20" fill="#fb923c"/>

  <text x="50" y="50" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#fb923c" letter-spacing="2">FIELD PROPULSION // ELECTROGRAVITICS</text>
</svg>
